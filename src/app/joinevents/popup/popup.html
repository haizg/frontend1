<div class="modal-overlay" (click)="close()">
  <form (click)="$event.stopPropagation()">

    <h1>{{ 'popup.title' | translate }}</h1>

    <div>
      <label>{{ 'popup.email' | translate }}</label>
      <input
        type="email"
        [value]="email"
        readonly
        name="email"
        style="background:#f0f0f0; cursor:not-allowed;"
      />
    </div>

    <div class="message success-message" *ngIf="message === 'success'">
      <p>{{ 'popup.success' | translate }}</p>
    </div>

    <p class="message error-message" *ngIf="message === 'error'">
      {{ 'popup.error' | translate }}
    </p>

    <button type="button" (click)="submit()" [disabled]="isLoading || message === 'success'">
      {{ isLoading ? ('popup.submitting' | translate) : ('popup.submit' | translate) }}
    </button>

    <button type="button" class="cancel" (click)="close()" [disabled]="!canClose">
      {{ 'popup.cancel' | translate }}
    </button>

  </form>
</div>
