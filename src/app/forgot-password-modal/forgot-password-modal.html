<div class="modal-backdrop" *ngIf="isVisible" (click)="close()"></div>

<div class="modal-container" *ngIf="isVisible" (click)="$event.stopPropagation()">
  <div class="modal-content">

    <div class="modal-header">
      <h2>{{ 'forgotpassword.title' | translate }}</h2>
      <button class="close-btn" (click)="close()">✕</button>
    </div>

    <div class="modal-body">
      <p class="info-text">{{ 'forgotpassword.infotext' | translate }}</p>

      <div class="form-group">
        <label>{{ 'forgotpassword.email' | translate }}</label>
        <input
          type="email"
          [(ngModel)]="email"
          [placeholder]="'forgotpassword.placeholder' | translate"
          class="form-input"
          [disabled]="isLoading"
          (keyup.enter)="onSubmit()">
      </div>

      <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
      <div class="success-message" *ngIf="successMessage">{{ successMessage }}</div>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn-cancel" (click)="close()" [disabled]="isLoading">
        {{ 'forgotpassword.cancel' | translate }}
      </button>
      <button type="button" class="btn-submit" (click)="onSubmit()" [disabled]="isLoading || !email">
        {{ isLoading ? ('forgotpassword.sending' | translate) : ('forgotpassword.send' | translate) }}
      </button>
    </div>
